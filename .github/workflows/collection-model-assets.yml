name: Import original collection models

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: somass-original-collection-models
  cancel-in-progress: false

jobs:
  import-original-models:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'collection-models-original-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: model-assets-publish
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          ref: collection-model-assets
          path: _assets
          sparse-checkout: models
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Verify archives and import original GLBs
        run: python3 model-assets-publish/import-original-models.py --manifest model-assets-publish/archives-manifest.json --checkout _assets
